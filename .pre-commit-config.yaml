default_language_version:
    python: python3.13
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: ruff check --fix --config pyproject.toml
        language: system
        always_run: true
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: ruff format --config pyproject.toml
        language: system
        always_run: true
        types: [python]
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy --config-file=./pyproject.toml src
        pass_filenames: false
        language: system
        always_run: true
  - repo: local
    hooks:
      - id: vulture
        name: vulture
        entry: vulture src --min-confidence 90
        pass_filenames: false
        language: system
        always_run: true
