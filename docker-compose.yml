services:
  postgres:
    image: postgres:15-alpine
    container_name: buffett-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: buffett
      POSTGRES_PASSWORD: buffett
      POSTGRES_DB: buffett
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buffett -d buffett"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
